<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەڕەیا من | My Profile</title>
    <!-- لێرە مە فۆنتێ نێڤدەولەتی یێ گونجای بکارئینایە -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 90%;
            padding: 20px;
        }
        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e293b;
            color: white;
            padding: 12px 20px;
            margin: 15px 0;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn:hover {
            transform: translateY(-3px);
            background-color: #334155;
        }
        .btn img {
            width: 28px;
            height: 28px;
            margin-left: 12px;
        }
        .tiktok-btn:hover {
            border-color: #fe2c55;
        }
        .snap-btn:hover {
            border-color: #fffc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- وێنەیێ لوگۆی (پێدڤیە فایلێ logo.png د هەمان پشکێدا بیت) -->
        <img src="logo.png" alt="Logo" class="logo">
        
        <h1>خێر هاتن بۆ پەڕەیا من</h1>

        <!-- کوشکا تیکتۆکی (راستەوخۆ دچتە سەر پروفایلی) -->
        <a href="https://www.tiktok.com/@r_german?_r=1&_t=ZS-98aMTFZnqc8" target="_blank" class="btn tiktok-btn">
            <span>تیکتۆک (TikTok)</span>
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
        </a>

        <!-- کوشکا سناپچاتی (راستەوخۆ دچتە سەر ئەکاونتی) -->
        <a href="https://snapchat.com/t/JETR6xEy" target="_blank" class="btn snap-btn">
            <span>سناپچات (Snapchat)</span>
            <img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="Snapchat">
        </a>
    </div>

</body>
</html>
