<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-GERMAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* پاشبنەمایێ سەرەکی یێ وێبسایتێ سپی (White) */
            background-color: #ffffff;
            color: #1e293b;
            font-family: 'Noto Sans Arabic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 90%;
            padding: 25px;
            /* پشکەکا تاری و شین د ناڤدا بۆ جوانیێ */
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            direction: rtl;
        }
        p {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
            direction: ltr; /* بۆ ڕێزبەندیا دروست یا BMW , AUDI , AMG */
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #0f172a;
            padding: 12px 20px;
            margin: 15px 0;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .btn:hover {
            transform: translateY(-3px);
            background-color: #f1f5f9;
        }
        .btn img {
            width: 26px;
            height: 26px;
            margin-left: 12px;
            border-radius: 6px;
            object-fit: cover;
        }
        .tiktok-btn span {
            color: #000000;
        }
        .snap-btn span {
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Logo" class="logo">
        
        <h1>بخێرهاتن بۆ وێبسايتێ R-GERMAN</h1>
        <p>( BMW , AUDI , AMG )</p>

        <a href="https://www.tiktok.com/@r_german?_r=1&_t=ZS-98aMTFZnqc8" target="_blank" class="btn tiktok-btn">
            <span>تیکتۆک (TikTok)</span>
            <img src="tiktok.png" alt="TikTok">
        </a>

        <a href="https://snapchat.com/t/JETR6xEy" target="_blank" class="btn snap-btn">
            <span>سناپچات</span>
            <img src="snap.png" alt="Snapchat">
        </a>
    </div>

</body>
</html>
