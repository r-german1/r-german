<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-GERMAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #090d16 0%, #05070a 100%);
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 90%;
            padding: 20px;
        }
        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        p {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(30, 41, 59, 0.8);
            color: white;
            padding: 12px 20px;
            margin: 15px 0;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .btn:hover {
            transform: translateY(-3px);
            background-color: rgba(51, 65, 85, 0.9);
            box-shadow: 0 6px 15px rgba(56, 189, 248, 0.2);
        }
        .btn img {
            width: 28px;
            height: 28px;
            margin-left: 12px;
            border-radius: 6px;
            object-fit: cover;
        }
        .tiktok-btn:hover {
            border-color: #fe2c55;
        }
        .snap-btn:hover {
            border-color: #fffc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- وێنەیێ لۆگۆی -->
        <img src="logo.png" alt="Logo" class="logo">
        
        <h1>بخێرهاتن بۆ وێبسايتێ R-GERMAN</h1>
        <p>ئەم ل ڤێرەینە بۆ دروستکرنا هەمی ترۆمبێلێن ئەلمانی</p>

        <!-- کوشکا تیکتۆکی -->
        <a href="https://www.tiktok.com/@r_german?_r=1&_t=ZS-98aMTFZnqc8" target="_blank" class="btn tiktok-btn">
            <span>تیکتۆک (TikTok)</span>
            <img src="tiktok.png" alt="TikTok">
        </a>

        <!-- کوشکا سناپچاتی -->
        <a href="https://snapchat.com/t/JETR6xEy" target="_blank" class="btn snap-btn">
            <span>سناپچات</span>
            <img src="snap.png" alt="Snapchat">
        </a>
    </div>

</body>
</html>
